<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Welcome</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #222; max-width: 600px; margin: 0 auto; padding: 24px;">
    <h2 style="color: #2b6cb0;">Hi {{ name }},</h2>
    <p>Thanks for your interest. We wanted to reach out personally to share something we think you'll find useful.</p>
    <p>
      <a href="https://example.com" style="background:#2b6cb0;color:#fff;padding:10px 16px;text-decoration:none;border-radius:6px;display:inline-block;">
        Learn more
      </a>
    </p>
    <p>Looking forward to hearing from you.</p>
    <hr style="border:none;border-top:1px solid #eee;margin:24px 0;">
    <p style="font-size:12px;color:#888;">
      If you'd rather not hear from us, just reply with the word "{{ unsubscribe_keyword }}" and we'll stop.
    </p>
  </body>
</html>
